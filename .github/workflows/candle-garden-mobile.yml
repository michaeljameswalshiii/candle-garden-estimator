name: Candle Garden Mobile

on:
  pull_request:
    paths:
      - "candle-garden-mobile/**"
      - "packages/catalog/**"
      - ".github/workflows/candle-garden-mobile.yml"
  push:
    branches: [main]
    paths:
      - "candle-garden-mobile/**"
      - "packages/catalog/**"
      - ".github/workflows/candle-garden-mobile.yml"

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: candle-garden-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candle-garden-mobile/package-lock.json
      - run: npm ci
      - run: npm run check
